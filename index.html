// ---------- Log workout: one working weight, reps steppers, compact warm-up ----------
const wStep = (d) => (d.unit === 'kg' ? 2.5 : 5);
const isW = (s) => s.type === 'working';

function draftFromWorkout(w) {
  const working = w.sets.filter(isW);
  const ww = working.length ? String(working[0].weight) : '';
  return { ...w, newPhase: L.isPhaseStart(w), workWeight: ww,
    sets: w.sets.map((s) => ({ type: s.type, weight: String(s.weight), reps: String(s.reps), own: isW(s) && String(s.weight) !== ww })) };
}
// What gets saved: every non-overridden working set uses the working weight.
const composeSets = (d) => d.sets.filter((s) => isW(s) || s.weight !== '').map((s) => ({ type: s.type, weight: isW(s) && !s.own ? d.workWeight : s.weight, reps: s.reps }));
function logProblem(d) {
  if (!d.machineId) return 'Choose a machine.';
  let wu = 0, n = 0;
  for (const s of d.sets) {
    if (isW(s)) {
      n++;
      if (!s.own && (d.workWeight === '' || !(+d.workWeight >= 0))) return 'Enter your working weight.';
      if (s.own && (s.weight === '' || !(+s.weight >= 0))) return `Set ${n}: enter its weight.`;
      if (s.reps === '' || !Number.isInteger(+s.reps) || +s.reps < 1) return `Set ${n}: enter the reps you got.`;
    } else {
      wu++;
      if (s.weight !== '' && s.reps === '') return `Warm-up${d.sets.filter((x) => !isW(x)).length > 1 ? ' ' + wu : ''}: enter weight and reps, or remove it.`;
    }
  }
  return null;
}

function lastHint(d) {
  if (!d.machineId) return '';
  const prev = L.sortWorkouts(workoutsFor(d.machineId).filter((w) => w.id !== d.id && w.date <= d.date)).at(-1);
  if (!prev) return `<div class="lastline muted">First workout on this machine.</div>`;
  const work = prev.sets.filter(isW);
  return `<div class="lastline"><span class="muted">Last time · ${fmtDate(prev.date)}</span> <b class="num">${work.map((s) => `${fmt(s.weight)} × ${s.reps}`).join(' · ') || 'warm-up only'}</b> <span class="muted">${unitLabel(prev.unit)}</span></div>`;
}

function logBody(d) {
  const u = d.unit, warm = [], work = [];
  d.sets.forEach((s, i) => (isW(s) ? work : warm).push([s, i]));
  const wuHtml = warm.map(([s, i]) => S.wuEdit === i
    ? `<div class="wuedit"><span class="k-sm">Warm-up</span><input type="number" inputmode="decimal" step="any" min="0" data-lg="wuw" data-i="${i}" value="${esc(s.weight)}" aria-label="Warm-up weight"><span class="muted">${u} ×</span>
        <input type="number" inputmode="numeric" min="1" step="1" data-lg="wur" data-i="${i}" value="${esc(s.reps)}" aria-label="Warm-up reps"><button type="button" class="btn sm" data-action="lg-wu-done">Done</button>
        <button type="button" class="btn ghost sm" data-action="lg-wu-del" data-i="${i}" aria-label="Remove warm-up">✕</button></div>`
    : `<button type="button" class="wuline" data-action="lg-wu" data-i="${i}"><span class="chip warm">Warm-up</span> <b class="num">${s.weight === '' ? '—' : fmt(+s.weight)} ${u} × ${s.reps || '—'}</b><span class="spacer"></span><span class="muted xs">Change</span></button>`).join('');
  const sets = work.map(([s, i], n) => `<div class="setline">
      <div class="sl-name"><div class="t">Set ${n + 1}</div>${s.own
        ? `<div class="ownw"><input type="number" inputmode="decimal" step="any" min="0" data-lg="own" data-i="${i}" value="${esc(s.weight)}" aria-label="Set ${n + 1} weight"><span class="muted xs">${u}</span><button type="button" class="btn ghost xs" data-action="lg-unown" data-i="${i}" title="Use working weight">↺</button></div>`
        : `<button type="button" class="wlabel" data-action="lg-own" data-i="${i}">${d.workWeight === '' ? '—' : fmt(+d.workWeight)} ${u} · change</button>`}</div>
      <div class="stepper"><button type="button" data-action="lg-rep" data-i="${i}" data-v="-1" aria-label="One rep fewer">−</button>
        <input type="number" inputmode="numeric" min="1" step="1" data-lg="rep" data-i="${i}" value="${esc(s.reps)}" placeholder="–" aria-label="Set ${n + 1} reps">
        <button type="button" data-action="lg-rep" data-i="${i}" data-v="1" aria-label="One more rep">+</button></div>
      <button type="button" class="btn ghost sm rm" data-action="lg-del" data-i="${i}" aria-label="Remove set ${n + 1}" ${work.length === 1 ? 'disabled' : ''}>✕</button></div>`).join('');
  return `${wuHtml || `<button type="button" class="linkbtn" data-action="lg-wu-add">+ Add warm-up</button>`}
    <div class="ww"><div class="k-sm">Working weight</div><div class="stepper big">
      <button type="button" data-action="lg-ww" data-v="-1" aria-label="Lower by ${wStep(d)}">−${wStep(d)}</button>
      <input type="number" inputmode="decimal" step="any" min="0" data-lg="ww" value="${esc(d.workWeight)}" placeholder="0" aria-label="Working weight"><span class="unit">${u}</span>
      <button type="button" data-action="lg-ww" data-v="1" aria-label="Raise by ${wStep(d)}">+${wStep(d)}</button></div></div>
    <div class="sets">${sets}</div>
    <button type="button" class="linkbtn" data-action="lg-add">+ Add set</button>`;
}
function logRefresh(focusSel) {
  const b = $('#logbody'); if (!b || !S.draft) return;
  b.innerHTML = logBody(S.draft);
  const h = $('#lasthint'); if (h) h.innerHTML = lastHint(S.draft);
  if (focusSel) { const el = $(focusSel); if (el) { el.focus(); if (el.select) el.select(); } }
}

function viewLog(workoutId, machineId) {
  const ms = machineList();
  if (!ms.length) return `<h1>Log workout</h1><div class="card empty section"><h2>Add a machine first</h2><button class="btn primary" data-action="starters">Add 13 common machines</button> <a class="btn" href="#machine-new">Add a machine</a></div>`;
  if (workoutId && !S.workouts[workoutId]) return notFound();
  S.editing = true;
  if (!S.draft) { S.draft = workoutId ? draftFromWorkout(S.workouts[workoutId]) : newDraft(machineId); S.wuEdit = null; S.moreOpen = false; }
  const d = S.draft;
  return `<a class="back" href="${d.machineId ? '#machine-' + d.machineId : '#dashboard'}">← Back</a>
  <form data-form="workout" class="logform" novalidate><div id="ferr"></div>
    <div class="row" style="gap:8px;margin-bottom:2px"><h1 style="margin:0">${workoutId ? 'Edit workout' : 'Log workout'}</h1>${workoutId ? `<span class="muted">${fmtDate(d.date, true)}${d.time ? ' · ' + fmtTime(d.time) : ''}</span>` : ''}</div>
    <select name="machineId" class="msel" aria-label="Machine"><option value="">Choose a machine…</option>${ms.map((m) => `<option value="${m.id}" ${m.id === d.machineId ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>
    <div id="lasthint">${lastHint(d)}</div>
    <div class="card" id="logbody">${logBody(d)}</div>
    <details class="more" ${S.moreOpen ? 'open' : ''}><summary>More — notes, date, units, control phase</summary>
      <div style="padding-top:10px">
        ${d.autoDate ? `<p class="muted" style="font-size:13px;margin:0 0 10px">Saved with today’s date and the time you tap Save. <button type="button" class="linkbtn" data-action="lg-date" style="display:inline;padding:0">Log for an earlier day</button></p>`
          : `<label class="f">Date${d.time ? ` <span class="opt">(logged at ${fmtTime(d.time)})</span>` : ''}<input type="date" name="date" value="${esc(d.date)}" max="${today()}"></label>`}
        <div class="row" style="margin-bottom:12px"><span class="k-sm">Units</span><div class="seg">${['lb', 'kg'].map((x) => `<button type="button" data-action="lg-unit" data-v="${x}" class="${d.unit === x ? 'on' : ''}">${x}</button>`).join('')}</div></div>
        <label class="f" style="display:flex;gap:10px;align-items:flex-start;font-weight:500;color:var(--text)"><input type="checkbox" data-input="phase" ${d.newPhase ? 'checked' : ''} style="width:20px;height:20px;margin:1px 0 0;flex:none">
          <span>Start a new control phase<br><span class="muted" style="font-size:13px">Stricter form, less momentum. Records restart from this workout.</span></span></label>
        <label class="f">Notes<textarea name="notes" maxlength="1000" placeholder="Seat height, tempo, how it felt…">${esc(d.notes || '')}</textarea></label>
        ${workoutId ? `<button type="button" class="btn danger" data-action="del-workout" data-id="${workoutId}">Delete workout</button>` : ''}
      </div></details>
    <div class="savebar"><button class="btn primary" type="submit">${workoutId ? 'Save changes' : 'Save workout'}</button></div>
  </form>`;
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-action^="lg-"]'); if (!a || !S.draft) return;
  e.preventDefault();
  const d = S.draft, i = +a.dataset.i, fe = $('#ferr'); if (fe) fe.innerHTML = '';
  switch (a.dataset.action) {
    case 'lg-wu': S.wuEdit = i; return logRefresh(`[data-lg="wuw"][data-i="${i}"]`);
    case 'lg-wu-done': S.wuEdit = null; return logRefresh();
    case 'lg-wu-del': d.sets.splice(i, 1); S.wuEdit = null; return logRefresh();
    case 'lg-wu-add': { const at = d.sets.filter((s) => !isW(s)).length; d.sets.splice(at, 0, { type: 'warmup', weight: '', reps: String(S.prefs.warmupReps) }); S.wuEdit = at; return logRefresh(`[data-lg="wuw"][data-i="${at}"]`); }
    case 'lg-ww': { const v = L.round1(Math.max(0, (+d.workWeight || 0) + +a.dataset.v * wStep(d))); d.workWeight = String(v); return logRefresh(); }
    case 'lg-rep': {
      const s = d.sets[i], r = (+s.reps || 0) + +a.dataset.v; s.reps = r < 1 ? '' : String(Math.min(200, r));
      const inp = $(`[data-lg="rep"][data-i="${i}"]`); if (inp) inp.value = s.reps; return;
    }
    case 'lg-own': d.sets[i].own = true; d.sets[i].weight = d.workWeight; return logRefresh(`[data-lg="own"][data-i="${i}"]`);
    case 'lg-unown': d.sets[i].own = false; return logRefresh();
    case 'lg-del': if (d.sets.filter(isW).length > 1) d.sets.splice(i, 1); return logRefresh();
    case 'lg-add': d.sets.push({ type: 'working', weight: d.workWeight, reps: '', own: false }); return logRefresh();
    case 'lg-date': d.autoDate = false; d.date = today(); S.moreOpen = true; return render();
    case 'lg-unit': {
      const to = a.dataset.v; if (to === d.unit) return;
      const cv = (x) => (x !== '' && isFinite(+x) ? String(L.round1(L.convert(+x, d.unit, to))) : x);
      d.workWeight = cv(d.workWeight); for (const s of d.sets) s.weight = cv(s.weight);
      d.unit = to; document.querySelectorAll('[data-action="lg-unit"]').forEach((b) => b.classList.toggle('on', b.dataset.v === to)); return logRefresh();
    }
  }
});
document.addEventListener('input', (e) => {
  const t = e.target, d = S.draft; if (!t.dataset.lg || !d) return;
  const i = +t.dataset.i, fe = $('#ferr'); if (fe) fe.innerHTML = '';
  if (t.dataset.lg === 'ww') { d.workWeight = t.value; document.querySelectorAll('.wlabel').forEach((b) => { b.textContent = `${t.value === '' ? '—' : fmt(+t.value)} ${d.unit} · change`; }); }
  else if (t.dataset.lg === 'rep') d.sets[i].reps = t.value;
  else if (t.dataset.lg === 'own') d.sets[i].weight = t.value;
  else if (t.dataset.lg === 'wuw') d.sets[i].weight = t.value;
  else if (t.dataset.lg === 'wur') d.sets[i].reps = t.value;
});
document.addEventListener('toggle', (e) => { if (e.target.classList && e.target.classList.contains('more')) S.moreOpen = e.target.open; }, true);

// ---------- Boot ----------
(async () => {
  await Store.init();
  if (typeof OFFLINE_APP !== 'undefined') {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
  // One-time: move "Warm-up weights: …" from imported notes into the warm-up list (the "later" values are current).
  for (const m of Object.values(S.machines)) {
    const mm = /^Warm-up weights: ([^.]*)\.\s*/.exec(m.notes || '');
    if (!mm || (m.warmups || []).length) continue;
    const later = /\(later ([^)]*)\)/.exec(mm[1]);
    const list = (later ? later[1] : mm[1].replace(/\(.*\)/, '')).split(',').map((x) => parseFloat(x)).filter((x) => isFinite(x));
    const { id, ...body } = m;
    try { await Store.put('m_' + id, { ...body, warmups: list.map((w) => ({ weight: w, reps: S.prefs.warmupReps })), wuUnit: 'lb', notes: m.notes.slice(mm[0].length) }); } catch (e) {}
  }
  // One-time fix: imported warm-up lists were progress over time, not separate sets. Keep only the latest,
  // and only where the list is still exactly what was imported (never touch warm-ups the user edited).
  if (!S.prefs.wu1) {
    const ORIG = {"Tricep Extension": [50.0, 65.0], "Triceps Press": [100.0, 110.0, 120.0, 125.0], "Shoulder Press": [50.0, 55.0], "MTS Shoulder Press": [25.0, 50.0, 55.0], "Pec Fly": [55.0, 75.0, 80.0], "MTS Row": [30.0, 35.0, 40.0], "Lat Pulldown": [70.0, 80.0], "Crunch": [60.0, 75.0, 85.0, 90.0, 100.0, 110.0, 115.0, 120.0, 125.0, 130.0], "Leg Curl": [40.0, 45.0, 60.0], "Hip Adductor": [65.0, 70.0]};
    for (const m of Object.values(S.machines)) {
      const o = ORIG[m.name], w = (m.warmups || []).map((x) => x.weight);
      if (!o || o.length < 2 || w.length !== o.length || w.some((x, i) => x !== o[i])) continue;
      const { id, ...body } = m;
      try { await Store.put('m_' + id, { ...body, warmups: [m.warmups[m.warmups.length - 1]] }); } catch (e) {}
    }
    try { await Store.put('prefs', { ...S.prefs, wu1: true }); } catch (e) {}
  }
  // One-time: the base number of working sets moved from 2 to 3.
  if (!S.prefs.ws3) { const p = sanitizePrefs({ ...S.prefs, workingSets: S.prefs.workingSets === 2 ? 3 : S.prefs.workingSets }); if (p) { try { await Store.put('prefs', p); } catch (e) {} } }
  applyTheme();
  render();
  if (S.migrated) toast(`Moved ${S.migrated} items into your account`);
})();
</script>
</body>
</html>
