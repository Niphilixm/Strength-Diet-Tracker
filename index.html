<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strength">
<title>Machine Strength Tracker</title>
<style>:root{
  --m-p:#2a78d6;--m-c:#eb6834;--m-f:#1baf7a;
  --bg:#f9f9f7;--surface:#fcfcfb;--surface-2:#f2f1ed;--border:#e1e0d9;--border-strong:#c3c2b7;
  --text:#0b0b0b;--text-2:#52514e;--muted:#898781;--accent:#2a78d6;--accent-ink:#fff;--accent-soft:#e6f0fc;
  --good:#0b7f0b;--bad:#c23535;--warm:#9a6700;--warm-soft:#fbf1dc;--grid:#e1e0d9;--axis:#c3c2b7;
  --radius:10px;--shadow:0 1px 2px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d0d0d;--surface:#1a1a19;--surface-2:#242422;--border:#2c2c2a;--border-strong:#383835;
  --text:#f0efec;--text-2:#c3c2b7;--muted:#898781;--accent:#3987e5;--accent-soft:#16263a;
  --good:#3fbf3f;--bad:#e66767;--warm:#e0a526;--warm-soft:#2e2510;--grid:#2c2c2a;--axis:#383835;color-scheme:dark;--m-p:#3987e5;--m-c:#d95926;--m-f:#199e70;}}
:root[data-theme=dark]{
  --bg:#0d0d0d;--surface:#1a1a19;--surface-2:#242422;--border:#2c2c2a;--border-strong:#383835;
  --text:#f0efec;--text-2:#c3c2b7;--muted:#898781;--accent:#3987e5;--accent-soft:#16263a;
  --good:#3fbf3f;--bad:#e66767;--warm:#e0a526;--warm-soft:#2e2510;--grid:#2c2c2a;--axis:#383835;color-scheme:dark;--m-p:#3987e5;--m-c:#d95926;--m-f:#199e70;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.num,td.n,.tile .v{font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1080px;margin:0 auto;padding:0 16px 96px}
header.top{display:flex;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:20px}
.brand{font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs a{padding:7px 12px;border-radius:8px;color:var(--text-2);font-weight:500}
nav.tabs a.on{background:var(--surface-2);color:var(--text)}
nav.bottom{display:none}
@media (max-width:720px){
  nav.tabs{display:none}
  nav.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
  nav.bottom a{flex:1;text-align:center;padding:6px 2px;color:var(--muted);font-size:12px;font-weight:500}
  nav.bottom a svg{display:block;margin:0 auto 2px;width:22px;height:22px}
  nav.bottom a.on{color:var(--accent)}
  nav.bottom a.log{color:var(--accent-ink)}
  nav.bottom a.log span{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);border-radius:999px;width:40px;height:40px;margin-top:-4px}
  nav.bottom a.log svg{margin:0}
}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.015em}
h2{font-size:16px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:14px;margin:0 0 8px;color:var(--text-2);font-weight:600}
.sub{color:var(--text-2);margin:0 0 18px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.g2{grid-template-columns:1fr}}
.section{margin-top:22px}
.tile{padding:14px}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.tile .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.tile .v small{font-size:13px;font-weight:500;color:var(--text-2)}
.tile .d{font-size:12px;color:var(--text-2);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);
  padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:550;min-height:38px;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--text-2);font-weight:550;font-size:13px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:12px}
label.f span.opt{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);min-height:40px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.err{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-weight:550}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--border);color:var(--text)}
.li:first-child{border-top:0}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--text-2)}
.li .r{margin-left:auto;text-align:right;white-space:nowrap}
a.li:hover .t{color:var(--accent)}
.chip{display:inline-block;font-size:11px;font-weight:650;padding:2px 7px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.chip.warm{background:var(--warm-soft);color:var(--warm)}
.chip.work{background:var(--accent-soft);color:var(--accent)}
.chip.pr{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.up{color:var(--good)} .down{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--border)}
td{padding:7px 8px;border-bottom:1px solid var(--border)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.setrow{display:grid;grid-template-columns:28px 172px 1fr 1fr 36px;gap:8px;align-items:end;padding:10px 0;border-top:1px solid var(--border)}
.setrow:first-of-type{border-top:0}
.setrow .idx{font-weight:650;color:var(--muted);padding-bottom:10px}
.setrow input{margin-top:3px}
.setrow .lbl{font-size:12px;color:var(--muted);font-weight:600}
@media (max-width:520px){.setrow{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 32px;row-gap:8px}
  .setrow>:nth-child(1){grid-column:1;grid-row:1/3;align-self:center;padding:0}
  .setrow>:nth-child(2){grid-column:2/4;grid-row:1}
  .setrow>:nth-child(3){grid-column:2;grid-row:2}
  .setrow>:nth-child(4){grid-column:3;grid-row:2}
  .setrow>:nth-child(5){grid-column:4;grid-row:1/3;align-self:center}}
.typeseg{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;margin-top:3px}
.typeseg button{flex:1;border:0;background:transparent;border-radius:6px;padding:6px 4px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-2);white-space:nowrap}
.typeseg button.on.warmup{background:var(--warm-soft);color:var(--warm)}
.typeseg button.on.working{background:var(--accent-soft);color:var(--accent)}
.chart{position:relative;width:100%;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.chart text{font-size:11px;fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.35;
  white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));z-index:5;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.tip b{font-size:14px}
.empty{text-align:center;padding:36px 16px;color:var(--text-2)}
.empty .btn{margin-top:12px}
.banner{background:var(--warm-soft);color:var(--warm);border-radius:8px;padding:9px 12px;margin-bottom:16px;font-size:13px;font-weight:550}
.hl{display:block;color:var(--text)}
.hl:hover{border-color:var(--border-strong)}
.hl .nm{font-weight:650}
.hl .big{font-size:20px;font-weight:650;letter-spacing:-.02em}
.cmp td:first-child{color:var(--text-2)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:550;z-index:50;
  opacity:0;transition:opacity .15s;pointer-events:none}
.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:20px;max-width:420px;width:100%;border:1px solid var(--border)}
.modal p{color:var(--text-2)}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.back{display:inline-block;margin-bottom:10px;font-size:14px;font-weight:550}
.hint{font-size:13px;color:var(--text-2);background:var(--surface-2);border-radius:8px;padding:9px 12px;margin-bottom:12px}
.sets-mini{font-size:13px;color:var(--text-2)}
.sets-mini .w{color:var(--warm)}

.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.chip.neutral{background:var(--surface-2);color:var(--text-2)}
.k-sm{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.big2{font-size:17px;font-weight:650}
.xs{font-size:12px}
.cmp td,.cmp th{padding:6px 6px}

.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;vertical-align:baseline}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.bar span{display:block;height:100%;border-radius:999px}
.seg a.segl{display:inline-block;padding:5px 12px;border-radius:6px;color:var(--text-2);font-weight:550;font-size:13px}
.seg a.segl.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
button.li{width:100%;background:none;border:0;border-top:1px solid var(--border);cursor:pointer;font:inherit;color:inherit;text-align:left}
.list button.li:first-child{border-top:0}
button.li:hover .t{color:var(--accent)}
.warmtxt{color:var(--warm)}
.datenav{gap:8px;align-items:center}
.totals{background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-top:4px}
.gear{display:none;margin-left:auto;color:var(--text-2);padding:6px}
@media (max-width:720px){.gear{display:block}}
td.n,th.n{white-space:nowrap}
/* Log workout */
.logform{max-width:560px}
.msel{font-size:17px;font-weight:650;margin:10px 0 6px}
.lastline{font-size:14px;margin:0 0 10px;line-height:1.4}
.wuline{display:flex;align-items:center;gap:8px;width:100%;background:var(--surface-2);border:0;border-radius:8px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--text);margin-bottom:6px;text-align:left}
.wuedit{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.wuedit input{width:76px;margin:0;min-height:38px}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;padding:8px 0;cursor:pointer}
.ww{margin:12px 0 4px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{min-width:46px;height:46px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);font-size:20px;font-weight:600;color:var(--text);cursor:pointer}
.stepper button:active{background:var(--surface-2)}
.stepper input{width:64px;height:46px;margin:0;text-align:center;font-size:20px;font-weight:650;padding:4px}
.stepper.big{margin-top:6px}
.stepper.big button{font-size:15px;min-width:58px}
.stepper.big input{flex:1;max-width:130px;font-size:24px}
.stepper .unit{color:var(--muted);font-weight:600}
.sets{margin-top:10px;border-top:1px solid var(--border)}
.setline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.sl-name{flex:1;min-width:0}
.wlabel{background:none;border:0;padding:2px 0;color:var(--text-2);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.ownw{display:flex;align-items:center;gap:4px;margin-top:2px}
.ownw input{width:72px;margin:0;min-height:34px;padding:4px 6px}
.setline .rm{padding:4px 6px}
details.more{margin-top:12px;border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;background:var(--surface)}
details.more summary{cursor:pointer;font-weight:600;color:var(--text-2)}
.savebar{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:15;margin-top:8px}
.savebar .btn{width:100%;min-height:50px;font-size:16px}
@media (max-width:720px){.savebar{bottom:calc(58px + env(safe-area-inset-bottom))}}
</style>

<div class="app">
  <header class="top">

<script>const OFFLINE_APP = true;
// ---- Pure calculation logic (no DOM). Tested in Node. ----
const Logic = (() => {
  const LB_PER_KG = 2.20462262;
  const EPS = 1e-6;

  function convert(w, from, to) {
    if (from === to) return w;
    return from === 'kg' ? w * LB_PER_KG : w / LB_PER_KG;
  }
  const round1 = (x) => Math.round(x * 10) / 10;
  // Epley estimated one-rep max; used only to rank "best working set".
  const e1rm = (w, r) => (r <= 1 ? w : w * (1 + r / 30));

  function parseDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function dateStr(dt) {
    const p = (n) => String(n).padStart(2, '0');
    return `${dt.getFullYear()}-${p(dt.getMonth() + 1)}-${p(dt.getDate())}`;
  }
  const dayMs = 86400000;

  function sortWorkouts(list) {
    return list.slice().sort((a, b) =>
      a.date < b.date ? -1 : a.date > b.date ? 1 : (a.time || '') < (b.time || '') ? -1 : (a.time || '') > (b.time || '') ? 1 : (a.createdAt || 0) - (b.createdAt || 0));
  }
  // A workout that starts a new control phase (stricter form, less momentum).
  const isPhaseStart = (w) => !!w.newPhase || /^New control phase/.test(w.notes || '');
  // Split a machine's sorted workouts into phases; returns [{start, workouts}].
  function phases(sorted) {
    const out = [];
    for (const w of sorted) {
      if (!out.length || isPhaseStart(w)) out.push({ start: w.date, workouts: [] });
      out[out.length - 1].workouts.push(w);
    }
    return out;
  }

  // Metrics for a single workout, in display unit. Warm-up sets are excluded.
  function workoutMetrics(wk, unit) {
    const working = [];
    let warmups = 0;
    for (const s of wk.sets || []) {
      if (s.type === 'working') working.push({ weight: round1(convert(s.weight, wk.unit, unit)), reps: s.reps });
      else warmups++;
    }
    if (!working.length) return { hasWorking: false, warmups, workingSets: 0, volume: 0, reps: 0 };
    let topWeight = -Infinity;
    for (const s of working) if (s.weight > topWeight) topWeight = s.weight;
    let topReps = 0, volume = 0, reps = 0, best = null;
    const repsByWeight = {};
    for (const s of working) {
      if (Math.abs(s.weight - topWeight) < EPS && s.reps > topReps) topReps = s.reps;
      volume += s.weight * s.reps;
      reps += s.reps;
      const est = e1rm(s.weight, s.reps);
      if (!best || est > best.e1rm + EPS || (Math.abs(est - best.e1rm) < EPS && s.weight > best.weight))
        best = { weight: s.weight, reps: s.reps, e1rm: est };
      const k = String(s.weight);
      if (!(k in repsByWeight) || s.reps > repsByWeight[k]) repsByWeight[k] = s.reps;
    }
    return { hasWorking: true, warmups, workingSets: working.length, topWeight, topReps,
      volume: round1(volume), reps, best, repsByWeight };
  }

  // Full statistics for one machine's workouts.
  // scope: 'current' = only the latest control phase; 'all' = everything.
  function machineStats(workouts, unit, scope = 'all') {
    const all = sortWorkouts(workouts);
    const ph = phases(all);
    const sorted = scope === 'current' && ph.length ? ph[ph.length - 1].workouts : all;
    const points = [];
    const prs = [];
    let maxW = null, bestSet = null, bestVol = null;
    const repsAt = {}; // weight -> {reps, date}
    const nrm = {};    // N -> {weight, date}: heaviest weight done for at least N reps
    const step = unit === 'kg' ? 25 : 50;
    const bestForN = (m, n) => { let b = -1; for (const k in m.repsByWeight) if (m.repsByWeight[k] >= n && +k > b) b = +k; return b; };

// ---- Nutrition calculations (no DOM). Tested in Node. ----
const NL = (() => {
  const KCAL = { p: 4, c: 4, f: 9 };
  const r1 = (x) => Math.round(x * 10) / 10;
  const dstr = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  const pdate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = pdate(s); d.setDate(d.getDate() + n); return dstr(d); };

  // "1", "1.5", ".5", "1/2", "1 1/2" -> number (NaN if not a positive amount)
  function parseQty(v) {
    const s = String(v ?? '').trim();
    let m;
    if ((m = s.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[3] ? +m[1] + +m[2] / +m[3] : NaN;
    if ((m = s.match(/^(\d+)\/(\d+)$/))) return +m[2] ? +m[1] / +m[2] : NaN;
    if (/^(\d+\.?\d*|\.\d+)$/.test(s)) return +s;
    return NaN;
  }

  // An entry stores nutrition per serving and the number of servings eaten.
  const entryTotals = (e) => ({ cal: e.cal * e.qty, p: e.p * e.qty, c: e.c * e.qty, f: e.f * e.qty });
  function sumTotals(entries) {
    const t = { cal: 0, p: 0, c: 0, f: 0 };
    for (const e of entries) { const x = entryTotals(e); t.cal += x.cal; t.p += x.p; t.c += x.c; t.f += x.f; }
    return { cal: r1(t.cal), p: r1(t.p), c: r1(t.c), f: r1(t.f) };
  }

  // Share of macro calories (not grams). Returns null when there is nothing to split.
  function macroSplit(g) {
    const kc = { p: (g.p || 0) * KCAL.p, c: (g.c || 0) * KCAL.c, f: (g.f || 0) * KCAL.f };
    const total = kc.p + kc.c + kc.f;
    if (!(total > 0)) return null;
    return { total: Math.round(total), parts: ['p', 'c', 'f'].map((k) => ({ key: k, grams: r1(g[k] || 0), kcal: Math.round(kc[k]), pct: (kc[k] / total) * 100 })) };
  }

  function progress(consumed, target) {
    const t = Number(target) || 0;
    return { target: t, consumed: r1(consumed), remaining: r1(t - consumed), over: consumed > t && t > 0,
      pct: t > 0 ? (consumed / t) * 100 : null };
  }

  // Goals are stored as dated versions; a day uses the latest version on or before it.
  function goalFor(goals, date) {
    let best = null;
    for (const g of goals) if (g.from <= date && (!best || g.from > best.from)) best = g;
    return best;
  }

  function validateFood(f) {
    const name = String(f.name || '').trim();
    if (!name) return { ok: false, error: 'Food name is required.' };
    const size = Number(f.servingSize);
    if (!(size > 0) || size > 100000) return { ok: false, error: 'Serving size must be more than 0.' };
    const unit = String(f.servingUnit || '').trim();
    if (!unit) return { ok: false, error: 'Choose a serving unit.' };
    const out = { name: name.slice(0, 80), brand: String(f.brand || '').trim().slice(0, 60), servingSize: r1(size) || size, servingUnit: unit.slice(0, 20) };
    for (const [k, label] of [['cal', 'Calories'], ['p', 'Protein'], ['c', 'Carbs'], ['f', 'Fat']]) {
      if (f[k] === '' || f[k] == null) return { ok: false, error: `${label} is required (use 0 if none).` };
      const v = Number(f[k]);
      if (!isFinite(v) || v < 0 || v > 20000) return { ok: false, error: `${label} must be a number of 0 or more.` };
      out[k] = r1(v);
    }
    return { ok: true, value: out };
  }
  // Calories implied by macros differ a lot from the calories entered? (UI warning only)
  function calorieMismatch(f) {
    const implied = f.p * 4 + f.c * 4 + f.f * 9;
    if (!(f.cal > 0) && !(implied > 0)) return null;
    const diff = Math.abs(implied - f.cal);
    return diff > Math.max(20, 0.2 * Math.max(f.cal, implied)) ? Math.round(implied) : null;
  }

  // One row per calendar day in [from, to]. days: {date: entries[]}
  function dailySeries(days, goals, from, to) {
    const out = [];

      const t = sumTotals(entries), g = goalFor(goals, d);
      const pct = {};

      out.push({ date: d, logged: entries.length > 0, totals: t, goal: g, pct });

  }

  const weekStart = (s) => { const d = pdate(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dstr(d); };
  // Average intake per week or month, over logged days only.
  function averages(series, period) {
    const groups = {};

      if (!r.logged) continue;
      const key = period === 'month' ? r.date.slice(0, 7) : weekStart(r.date);
      (groups[key] = groups[key] || []).push(r);
    }
    return Object.keys(groups).sort().map((key) => {
      const rows = groups[key], n = rows.length, avg = {}, pct = {};
      for (const k of ['cal', 'p', 'c', 'f']) {
        avg[k] = r1(rows.reduce((a, r) => a + r.totals[k], 0) / n);
        const withGoal = rows.filter((r) => r.pct[k] != null);
        pct[k] = withGoal.length ? withGoal.reduce((a, r) => a + r.pct[k], 0) / withGoal.length : null;
      }
      return { key, days: n, avg, pct };
    });
  }

  // How often each goal was met, missed or exceeded (logged days that have a goal).
  const HIT_LOW = 90, HIT_HIGH = 110;
  function achievement(series) {
    const out = {};
    for (const k of ['cal', 'p', 'c', 'f']) {
      const rows = series.filter((r) => r.pct[k] != null);
      const short = rows.filter((r) => r.pct[k] < HIT_LOW).length, over = rows.filter((r) => r.pct[k] > HIT_HIGH).length;
      out[k] = { days: rows.length, avgPct: rows.length ? rows.reduce((a, r) => a + r.pct[k], 0) / rows.length : null,
        hit: rows.length - short - over, short, over };
    }

  }

  function byWeekday(series, k) {
    const out = [0, 1, 2, 3, 4, 5, 6].map((i) => ({ day: i, n: 0, sum: 0, short: 0 }));
    for (const r of series) {
      if (r.pct[k] == null) continue;
      const w = out[(pdate(r.date).getDay() + 6) % 7];

    }
    return out.map((w) => ({ day: w.day, n: w.n, avgPct: w.n ? w.sum / w.n : null, short: w.short }));
  }

  return { KCAL, parseQty, entryTotals, sumTotals, macroSplit, progress, goalFor, validateFood, calorieMismatch,
    dailySeries, averages, achievement, byWeekday, addDays, weekStart, HIT_LOW, HIT_HIGH, r1 };
})();

const Store = {
  coll: null,
  local: {},
  async init() {
    let db = null, user = null, id = null;
    try {
      if (window.claude && claude.use) {
        [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
        id = user ? await user.id() : null;
      }
    } catch (e) { db = null; }
    if (db && id) {
      this.coll = db.collection('data/users/' + id);
      S.mode = 'cloud';
      await new Promise((resolve) => {
        let first = true;
        const timer = setTimeout(() => { if (first) { first = false; S.slow = true; resolve(); } }, 10000);
        this.coll.onSnapshot((snap) => {
          S.machines = {}; S.workouts = {}; S.ngoals = {}; S.foods = {}; S.meals = {}; S.days = {}; S.prefs = { ...DEFAULT_PREFS };
          for (const d of snap.docs) applyDoc(d.id, d.data());
          if (!snap.metadata.fromCache) { S.slow = false; clearTimeout(timer); }
          applyTheme();
          if (first) { first = false; clearTimeout(timer); resolve(); } else if (!S.editing) render();
        }, (err) => { S.dbError = err.code; clearTimeout(timer); if (first) { first = false; resolve(); } render(); });
      });
      await this.migrateLocal();
    } else {
      S.mode = 'local';
      try { this.local = JSON.parse(localStorage.getItem('mst-data') || '{}'); } catch (e) { this.local = {}; S.noStorage = true; }

    }
  },
  // Move anything saved device-only (signed-out use) into the account once, without overwriting.
  async migrateLocal() {
    let local = {};

    const keys = Object.keys(local).filter((k) => k !== 'prefs' &&
      !(k.startsWith('m_') ? S.machines[k.slice(2)] : S.workouts[k.slice(2)]));
    if (!keys.length) { try { localStorage.removeItem('mst-data'); } catch (e) {} return; }
    try {
      for (const k of keys.sort((x) => (x.startsWith('m_') ? -1 : 1))) await this.put(k, local[k]);

  },
  queue: {},
  serial(key, fn) { const p = (this.queue[key] || Promise.resolve()).catch(() => {}).then(fn); this.queue[key] = p; return p; },
  put(key, body) { applyDoc(key, body); return this.serial(key, () => this._put(key, body)); },
  del(key) { applyDoc(key, null); return this.serial(key, () => this._del(key)); },
  async _put(key, body) {

      catch (e) {
        if (e && e.code === 'unavailable') { await new Promise((r) => setTimeout(r, 600 + Math.random() * 800)); await this.coll.doc(key).set(body); }
        else throw e;
      }
    } else {
      this.local[key] = body;
      try { localStorage.setItem('mst-data', JSON.stringify(this.local)); } catch (e) { throw { code: 'local' }; }
    }
  },
  async _del(key) {
    if (S.mode === 'cloud') await this.coll.doc(key).delete();
    else { delete this.local[key]; try { localStorage.setItem('mst-data', JSON.stringify(this.local)); } catch (e) { throw { code: 'local' }; } }
  },
};
const errMsg = (e) => (e && e.code === 'quota_exceeded' ? 'Storage is full. Export a backup and remove old data.' :

const setsMini = (wk) => wk.sets.map((s) => `<span class="${s.type === 'warmup' ? 'w' : ''}">${fmt(s.weight)}×${s.reps}</span>`).join(' · ');

// ---------- Charts (hand-built SVG, single series) ----------
const charts = {};
function niceTicks(min, max, n = 4, intOnly = false) {
  if (min === max) { const pad = Math.max(1, Math.abs(min) * 0.1); min -= pad; max += pad; }
  const span = max - min, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  let step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((s) => span / s <= n + 0.5) || mag * 10;
  if (intOnly) step = Math.max(1, Math.ceil(step));
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let v = lo; v <= hi + step / 2; v += step) t.push(Math.round(v * 1000) / 1000);
  return t;
}
function chartBox(id, height) { return `<div class="chart" id="${id}" style="height:${height}px"></div>`; }
// pts: [{t: dateStr, y, tip: html}], kind: 'line' | 'bar'
function drawChart(id, pts, { kind = 'line', height = 240, yLabel = '', zero = false, markers = [], color = 'var(--accent)' } = {}) {
  const el = document.getElementById(id); if (!el) return;
  charts[id] = { pts, opts: { kind, height, yLabel, zero, markers, color } };
  let mk = [];
  const W = Math.max(280, el.clientWidth), H = height;
  const m = { l: 46, r: 14, t: 12, b: 26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  if (!pts.length) { el.innerHTML = `<div class="empty" style="padding-top:${H / 2 - 20}px">No working sets in this range.</div>`; return; }
  const ys = pts.map((p) => p.y).concat(pts.filter((p) => p.goal > 0).map((p) => p.goal));
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (zero || kind === 'bar') lo = 0;
  const ticks = niceTicks(lo, kind === 'bar' ? Math.max(hi, 1) : hi, 4, kind === 'bar');
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const Y = (v) => m.t + ih - ((v - y0) / (y1 - y0 || 1)) * ih;
  let X, xs;
  if (kind === 'bar') {
    const bw = iw / pts.length;
    X = (i) => m.l + bw * i + bw / 2; xs = pts.map((_, i) => X(i));
  } else {
    const ts = pts.map((p) => L.parseDate(p.t).getTime());
    const t0 = Math.min(...ts), t1 = Math.max(...ts);
    X = (t) => (t1 === t0 ? m.l + iw / 2 : m.l + ((t - t0) / (t1 - t0)) * iw); xs = ts.map(X);
    mk = markers.map((d) => L.parseDate(d).getTime()).filter((t) => t >= t0 && t <= t1).map(X);
  }
  let g = '';
  for (const t of ticks) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${fmt(t)}</text>`;
  g += `<line x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="var(--axis)"/>`;
  // x labels: first, middle, last (bars: every few)
  const lab = (i) => `<text x="${xs[i]}" y="${H - 6}" text-anchor="${i === 0 && kind !== 'bar' ? 'start' : i === pts.length - 1 && kind !== 'bar' ? 'end' : 'middle'}">${esc(pts[i].xl || fmtDate(pts[i].t))}</text>`;
  const idx = kind === 'bar' ? pts.map((_, i) => i).filter((i) => (pts.length - 1 - i) % Math.max(1, Math.ceil(pts.length / 5)) === 0)
    : [...new Set([0, Math.floor((pts.length - 1) / 2), pts.length - 1])];
  if (kind !== 'bar' && pts.length > 1 && xs[idx[1]] - xs[0] < 60) idx.splice(1, 1);
  for (const i of idx) g += lab(i);
  let marks = '';
  for (const x of mk) marks += `<line x1="${x}" x2="${x}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--warm)" stroke-width="1.5" stroke-dasharray="4 3" opacity=".8"/>`;
  if (kind === 'bar') {
    const bw = Math.max(2, Math.min(28, (iw / pts.length) * 0.72));
    pts.forEach((p, i) => {
      const h = Math.max(0, m.t + ih - Y(p.y));
      const rr = Math.min(4, bw / 2);
      if (h >= rr && rr >= 2) marks += `<path d="M${xs[i] - bw / 2},${m.t + ih} v${-(h - rr)} q0,-${rr} ${rr},-${rr} h${bw - 2 * rr} q${rr},0 ${rr},${rr} v${h - rr} z" fill="${color}"/>`;
      else if (h > 0) marks += `<rect x="${xs[i] - bw / 2}" y="${m.t + ih - h}" width="${bw}" height="${h}" fill="${color}"/>`;
      if (p.goal > 0) marks += `<line x1="${xs[i] - bw / 2 - 2}" x2="${xs[i] + bw / 2 + 2}" y1="${Y(p.goal)}" y2="${Y(p.goal)}" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/>`;
    });
  } else {
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${xs[i].toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
    marks += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (pts.length <= 40) pts.forEach((p, i) => { marks += `<circle cx="${xs[i]}" cy="${Y(p.y)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`; });
  }
  el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(yLabel)} chart">${g}${marks}
    <line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--border-strong)" stroke-dasharray="3 3" style="display:none"/>
    <circle class="dot" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" style="display:none"/>
    <rect x="${m.l - 10}" y="0" width="${iw + 20}" height="${H}" fill="transparent" class="hit"/></svg><div class="tip"></div>`;
  const hit = el.querySelector('.hit'), tip = el.querySelector('.tip'), xh = el.querySelector('.xh'), dot = el.querySelector('.dot');
  const show = (ev) => {
    const r = el.getBoundingClientRect(), x = ev.clientX - r.left;
    let best = 0; for (let i = 1; i < xs.length; i++) if (Math.abs(xs[i] - x) < Math.abs(xs[best] - x)) best = i;
    const px = xs[best], py = Y(pts[best].y);
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.style.display = '';
    if (kind !== 'bar') { dot.setAttribute('cx', px); dot.setAttribute('cy', py); dot.style.display = ''; }
    tip.innerHTML = pts[best].tip; tip.style.display = 'block';
    const half = tip.offsetWidth / 2;
    tip.style.left = Math.min(Math.max(px, half), W - half) + 'px'; tip.style.top = Math.max(py, 40) + 'px';
  };
  const hide = () => { tip.style.display = 'none'; xh.style.display = 'none'; dot.style.display = 'none'; };
  hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show); hit.addEventListener('pointerleave', hide);
}
function sparkline(values, w = 120, h = 32) {
  if (values.length < 2) return '';

  const d = values.map((v, i) => `${i ? 'L' : 'M'}${(i / (values.length - 1) * (w - 4) + 2).toFixed(1)},${(h - 3 - (hi === lo ? (h - 6) / 2 : (v - lo) / (hi - lo) * (h - 6))).toFixed(1)}`).join('');
  return `<svg width="${w}" height="${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

const PR_LABEL = { weight: 'Heaviest', reps: 'Reps PR', set: 'Strength PR', volume: 'Volume PR', round: 'Milestone', nrm: 'Rep max' };
// Every workout with the records it set, judged within its own control phase.
function historyRows(mid) {
  const u = U(), all = statsFor(mid, 'all').all, prBy = {};
  for (const ph of L.phases(all)) for (const p of L.machineStats(ph.workouts, u, 'all').prs) (prBy[p.workoutId] = prBy[p.workoutId] || []).push(p);
  return all.map((w) => ({ w, m: L.workoutMetrics(w, u), prs: prBy[w.id] || [] }));
}
const KINDS = [['all', 'All'], ['pr', 'Any PR'], ['weight', 'Heaviest'], ['reps', 'Reps'], ['set', 'Strength'], ['volume', 'Volume'], ['round', 'Milestone'], ['nrm', 'Rep max'], ['phase', 'New phase']];
const kindMatch = (r, k) => k === 'all' || (k === 'pr' ? r.prs.length > 0 : k === 'phase' ? L.isPhaseStart(r.w) : r.prs.some((p) => p.kind === k));
function historyControls(mid) {

  return `<div class="row" style="gap:8px;margin-bottom:10px"><div class="seg" role="group" aria-label="Filter">${KINDS.map(([k, l]) => {
    const n = rows.filter((r) => kindMatch(r, k)).length;
    return `<button data-action="hkind" data-v="${k}" class="${kind === k ? 'on' : ''}">${l} <span class="muted">${n}</span></button>`; }).join('')}</div>
    <select data-input="hsort" aria-label="Sort" style="width:auto;margin:0;min-height:34px;padding:5px 8px">${[['new', 'Newest first'], ['old', 'Oldest first'], ['heavy', 'Heaviest first'], ['vol', 'Most volume']].map(([k, l]) => `<option value="${k}" ${sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`;
}
function historyBody(mid) {
  const f = S.ui.hf || {}, kind = f.kind || 'all', sort = f.sort || 'new', u = U();
  const toks = (f.q || '').toLowerCase().split(/\s+/).filter(Boolean);
  const setsOf = (r) => r.w.sets.filter((x) => x.type === 'working').map((x) => ({ w: L.round1(L.convert(x.weight, r.w.unit, u)), r: x.reps }));
  const tokOk = (r, t) => {
    let mm;
    if ((mm = t.match(/^(\d+(?:\.\d+)?)\s*[x×*\-]\s*(\d+)$/))) return setsOf(r).some((x) => x.w === +mm[1] && x.r === +mm[2]);
    if ((mm = t.match(/^(>=|<=|>|<)(\d+(?:\.\d+)?)$/))) { if (!r.m.hasWorking) return false; const v = r.m.topWeight, n = +mm[2];
      return mm[1] === '>' ? v > n : mm[1] === '<' ? v < n : mm[1] === '>=' ? v >= n : v <= n; }
    if (/^\d+(?:\.\d+)?$/.test(t) && !/^(19|20)\d\d$/.test(t)) return setsOf(r).some((x) => x.w === +t);
    const hay = (fmtDate(r.w.date, true) + ' ' + L.parseDate(r.w.date).getFullYear() + ' ' + MONTHS.join(' ').slice(0, 0) + (r.w.notes || '') + ' ' + r.prs.map((p) => PR_LABEL[p.kind]).join(' ') + (L.isPhaseStart(r.w) ? ' new phase' : '')).toLowerCase();
    return hay.includes(t);
  };
  let rows = historyRows(mid).filter((r) => kindMatch(r, kind) && toks.every((t) => tokOk(r, t)));
  const top = (r) => (r.m.hasWorking ? r.m.topWeight : -1);
  if (sort === 'heavy') rows.sort((a, b) => top(b) - top(a) || b.m.topReps - a.m.topReps);
  else if (sort === 'vol') rows.sort((a, b) => b.m.volume - a.m.volume);
  else if (sort === 'new') rows.reverse();
  const limit = S.histLimit || 40;
  return `<div class="muted" style="font-size:13px;margin-bottom:4px">${rows.length} workout${rows.length === 1 ? '' : 's'}${kind !== 'all' || toks.length ? ` · <a href="#" data-action="hclear">Clear filters</a>` : ''}</div>
    ${rows.length ? `<div class="list">${rows.slice(0, limit).map(({ w, prs }) => `<a class="li" href="#workout-${w.id}" style="align-items:flex-start"><div style="min-width:0">
      <div class="t">${fmtDate(w.date, true)}${w.time ? ` <span class="muted" style="font-weight:400">· ${fmtTime(w.time)}</span>` : ''}</div>

      ${L.isPhaseStart(w) || prs.length ? `<div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">${L.isPhaseStart(w) ? '<span class="chip warm">New phase</span>' : ''}${prs.map((p) => `<span class="chip pr">${PR_LABEL[p.kind]}${p.kind === 'reps' ? ' @ ' + fmt(p.weight) : p.kind === 'nrm' ? ' ' + p.n + 'RM' : ''}</span>`).join('')}</div>` : ''}
      ${w.notes && !/^New control phase/.test(w.notes) ? `<div class="s" style="margin-top:3px;white-space:normal">${esc(w.notes)}</div>` : ''}</div><div class="r s">Edit</div></a>`).join('')}</div>
    ${rows.length > limit ? `<button class="btn sm" data-action="hmore" style="margin-top:8px">Show ${Math.min(40, rows.length - limit)} more</button>` : ''}`
    : '<p class="muted">No workouts match.</p>'}
    <p class="muted" style="font-size:12px;margin:8px 0 0">W = warm-up (not counted). Records are judged within each control phase. Search a weight (225), a set (225x3), a top-weight range (&gt;200), a month or year, or words from notes.</p>`;
}

// ---------- Workout logging ----------
function newDraft(machineId) {
  const p = S.prefs;
  const d = { id: null, machineId: machineId || S.ui.lastMachine || '', date: today(), autoDate: true, newPhase: false, unit: p.unit, notes: '', sets: [] };
  if (!S.machines[d.machineId]) d.machineId = '';
  fillSetsFromDefaults(d);
  return d;
}
// Structure comes from the machine's working-set count; weights come from last time.
function fillSetsFromDefaults(d) {
  const p = S.prefs, prev = d.machineId ? L.sortWorkouts(workoutsFor(d.machineId)).at(-1) : null;
  const conv = (s) => String(L.round1(L.convert(s.weight, prev.unit, d.unit)));
  const pw = prev ? prev.sets.filter((s) => s.type === 'warmup') : [], pk = prev ? prev.sets.filter((s) => s.type === 'working') : [];
  const mw = (S.machines[d.machineId] || {}).warmups || [], mu = (S.machines[d.machineId] || {}).wuUnit || 'lb';
  const nWarm = pw.length, nWork = targetSets(d.machineId); // no blank warm-up rows; use + Add warm-up
  d.sets = [];
  if (mw.length) for (const w of mw) d.sets.push({ type: 'warmup', weight: String(L.round1(L.convert(w.weight, mu, d.unit))), reps: String(w.reps) });
  else for (let i = 0; i < nWarm; i++) { const s = pw[i]; d.sets.push({ type: 'warmup', weight: s ? conv(s) : '', reps: s ? String(s.reps) : String(p.warmupReps) }); }
  // Working sets go to failure, so reps start blank. One working weight (last time's top set) covers every set.
  const top = pk.length ? pk.reduce((m, s) => (s.weight > m.weight ? s : m), pk[0]) : null;
  d.workWeight = top ? conv(top) : '';
  for (let i = 0; i < nWork; i++) d.sets.push({ type: 'working', weight: d.workWeight, reps: '', own: false });
}

// ---------- Actions ----------
async function addStarters() {
  const existing = new Set(Object.values(S.machines).map((m) => m.name.toLowerCase()));
  let n = 0;
  try {
    for (const [name, muscle, category] of STARTERS) {
      if (existing.has(name.toLowerCase())) continue;
      await Store.put('m_' + uid(), { kind: 'machine', name, muscle, category, manufacturer: '', notes: '', createdAt: Date.now() }); n++;
    }
    toast(n ? `Added ${n} machines` : 'Those machines are already here');
  } catch (e) { toast(errMsg(e)); }
  render();
}

function syncCard() {

async function downloadOrShow(filename, data) {

    <textarea readonly style="min-height:120px;font-family:ui-monospace,monospace;font-size:12px">${esc(data)}</textarea><button class="btn sm" data-action="copy" style="margin-top:6px">Copy</button>`;
}

async function importData(data) {

    const v = L.validateWorkout({ ...(w || {}), sets: (w && w.sets) || [] }, null);
    if (v.ok && idOk(w.id) && mids.has(v.value.machineId)) workouts.push({ id: w.id, ...v.value, createdAt: Number(w.createdAt) || Date.now(), updatedAt: Number(w.updatedAt) || Date.now() });
  }

  const added = machines.filter((m) => !S.machines[m.id]).length;
  const ok = await confirmDialog('Restore backup?', `Add ${workouts.length} workouts and ${added} new machine${added === 1 ? '' : 's'}${merged ? ` (${merged} matched to machines you already have)` : ''}${skipped - merged > 0 ? `. ${skipped - merged} invalid items skipped` : ''}. ${nCount ? ` Also ${nCount} nutrition items (goals, foods, meals, diary days).` : ''} Items with matching IDs are replaced.`, 'Restore', false);

}

// ---------- Strength: workout comparison & records / milestones ----------
const VERDICT = {
  up: ['↑', 'Improvement', 'up'], same: ['=', 'No significant change', 'muted'], down: ['↓', 'Decline', 'down'],
  added: ['+', 'Extra set — not compared', 'muted'], dropped: ['−', 'Set not done this time', 'muted'], na: ['·', 'Not comparable', 'muted'],
};
const verdictTag = (v, short) => { const [i, t, c] = VERDICT[v]; return `<span class="${c}" style="font-weight:600;white-space:nowrap">${i} ${short && (v === 'up' || v === 'down' || v === 'same') ? { up: 'Better', down: 'Worse', same: 'Same' }[v] : t}</span>`; };

const L_SIG = 1.5;

function comparisonCard(mid) {
  const u = U(), list = statsFor(mid, 'all').all.filter((w) => L.workoutMetrics(w, u).hasWorking);
  if (list.length < 2) return `<div class="card section"><h2>Latest vs previous workout</h2><p class="muted">Log a second workout with working sets to compare.</p></div>`;
  const prev = list.at(-2), cur = list.at(-1), c = L.compareWorkouts(prev, cur, u);
  const newPrs = L.milestones(workoutsFor(mid), u).filter((e) => e.workoutId === cur.id);
  const notes = [];
  if (L.isPhaseStart(cur)) notes.push('This workout started a new control phase, so it’s being compared with a looser-form workout. Expect lower numbers — that’s not a strength loss.');
  if (c.structureDiffers) notes.push(`You did ${c.setsCur} working set${c.setsCur === 1 ? '' : 's'} this time and ${c.setsPrev} last time. Extra or missing sets don’t count as progress or decline.`);
  const sw = (x) => (x ? `${fmt(x.weight)} × ${x.reps}` : '<span class="muted">—</span>');
  const change = (r) => {
    if (!r.prev || !r.cur) return '';
    const bits = [];
    if (r.weightDiff) bits.push(signed(r.weightDiff, u));
    if (r.repsDiff) bits.push(signed(r.repsDiff, r.repsDiff === 1 || r.repsDiff === -1 ? 'rep' : 'reps', 0));
    return bits.join(', ') || 'same';
  };
  const [vi, vt, vc] = VERDICT[c.overall];
  return `<div class="card section" id="compare"><div class="row" style="margin-bottom:6px"><h2 style="margin:0">Latest vs previous workout</h2><span class="spacer"></span>
      <span class="chip ${c.overall === 'up' ? 'pr' : c.overall === 'down' ? 'bad' : 'neutral'}" style="font-size:13px;padding:4px 10px">${vi} ${vt}</span></div>
    <div class="muted" style="font-size:13px;margin-bottom:10px">${fmtDate(prev.date, true)}${prev.time ? ' ' + fmtTime(prev.time) : ''} → ${fmtDate(cur.date, true)}${cur.time ? ' ' + fmtTime(cur.time) : ''} · working sets only, in ${u}</div>
    ${notes.map((n) => `<div class="hint">${esc(n)}</div>`).join('')}
    <table class="cmp"><thead><tr><th>Set</th><th class="n">Previous</th><th class="n">Latest</th><th class="n">Change</th><th class="n">Result</th></tr></thead><tbody>
      ${c.rows.map((r, i) => `<tr><td>${r.cur ? 'Set ' + (r.cur.i + 1) : '<span class="muted">(prev. set ' + (r.prev.i + 1) + ')</span>'}</td><td class="n">${sw(r.prev)}</td><td class="n">${sw(r.cur)}</td>
        <td class="n">${change(r)}</td><td class="n">${verdictTag(r.verdict, true)}</td></tr>`).join('')}
    </tbody></table>
    <div class="grid g4" style="margin-top:14px">
      <div><div class="k-sm">Est. strength (best set)</div><div class="num big2">${pctTag(c.strengthPct)}</div><div class="muted xs">estimated 1-rep max</div></div>
      <div><div class="k-sm">Working sets</div><div class="num big2">${c.setsPrev} → ${c.setsCur}</div></div>
      <div><div class="k-sm">Working reps</div><div class="num big2">${c.repsPrev} → ${c.repsCur}</div><div class="muted xs">${c.repsPct == null ? '' : pct(c.repsPct)}</div></div>
      <div><div class="k-sm">Volume</div><div class="num big2">${fmtInt(c.volPrev)} → ${fmtInt(c.volCur)}</div><div class="muted xs">${c.volPct == null ? '' : pct(c.volPct) + ' · '}workload, not strength</div></div>
    </div>
    <div style="margin-top:12px">${newPrs.length ? `<h3 style="margin-bottom:4px">New records in the latest workout</h3><div class="list">${newPrs.map((e) => `<div class="li" style="padding:7px 2px"><div class="s" style="color:var(--text)">${eventLine(e, true)}</div></div>`).join('')}</div>`
      : '<p class="muted" style="margin:0;font-size:13px">No new records in the latest workout.</p>'}</div>
    <p class="muted xs" style="margin:10px 0 0">Sets are matched by weight, then by order. Same weight: more reps is better. More weight with the same or more reps is better. A trade-off between weight and reps is judged by estimated 1-rep max; a change under ${L_SIG}% counts as no significant change.</p>
  </div>`;
}

// ---- Record events ----
const EVENT_KINDS = [['weight', 'Heaviest weight'], ['reps', 'Rep record'], ['set', 'Est. strength'], ['volume', 'Volume'], ['round', 'Weight milestone'], ['nrm', 'Rep max']];
function eventParts(e) {
  const u = U();
  switch (e.kind) {
    case 'weight': return { title: 'New heaviest weight', now: `${fmt(e.weight)} ${u} × ${e.reps}`, was: `${fmt(e.prev)} ${u}`, gain: signed(e.weight - e.prev, u) + ` (${pct((e.weight - e.prev) / e.prev * 100)})` };
    case 'reps': return { title: `Rep record at ${fmt(e.weight)} ${u}`, now: `${e.reps} reps`, was: `${e.prev} reps`, gain: signed(e.reps - e.prev, e.reps - e.prev === 1 ? 'rep' : 'reps', 0) };
    case 'set': return { title: 'New estimated strength record', now: `${fmt(e.e1rm)} ${u} <span class="muted">(${fmt(e.weight)}×${e.reps})</span>`, was: `${fmt(e.prev)} ${u} <span class="muted">(${fmt(e.prevWeight)}×${e.prevReps})</span>`, gain: signed(e.e1rm - e.prev, u) + ` (${pct((e.e1rm - e.prev) / e.prev * 100)})` };
    case 'volume': return { title: 'Workout volume record', now: `${fmtInt(e.volume)} ${u}`, was: `${fmtInt(e.prev)} ${u}`, gain: signed(Math.round(e.volume - e.prev), u, 0) };
    case 'round': return { title: `First time at ${fmt(e.weight)}+ ${u}`, now: `${fmt(e.actual)} ${u}`, was: `${fmt(e.prev)} ${u}`, gain: signed(e.actual - e.prev, u) };
    case 'nrm': return { title: `New ${e.n}-rep max`, now: `${fmt(e.weight)} ${u} for ${e.n}+ reps`, was: `${fmt(e.prev)} ${u}`, gain: signed(e.weight - e.prev, u) };
  }
  return { title: e.kind, now: '', was: '', gain: '' };
}
function eventLine(e) { const p = eventParts(e); return `<span class="chip pr">${PR_LABEL[e.kind]}</span> ${p.title}: <b>${p.now}</b> <span class="muted">(was ${p.was}; ${p.gain})</span>`; }

function allEvents() {
  const u = U(), out = [];
  for (const m of Object.values(S.machines)) {
    const ws = workoutsFor(m.id); if (!ws.length) continue;
    const byId = Object.fromEntries(ws.map((w) => [w.id, w]));
    for (const e of L.milestones(ws, u)) out.push({ ...e, machine: m, time: byId[e.workoutId]?.time || '' });
  }
  return out;
}

function viewRecords() {
  const f = S.ui.rf || {}, mid = S.machines[f.machine] ? f.machine : '', kind = f.kind || 'all', order = f.order || 'new';
  let ev = allEvents().filter((e) => (!mid || e.machine.id === mid));
  const counts = Object.fromEntries(EVENT_KINDS.map(([k]) => [k, ev.filter((e) => e.kind === k).length]));
  const total = ev.length;
  if (kind !== 'all') ev = ev.filter((e) => e.kind === kind);
  ev.sort((a, b) => (a.date + a.time < b.date + b.time ? -1 : a.date + a.time > b.date + b.time ? 1 : 0));
  if (order === 'new') ev.reverse();
  const limit = S.recLimit || 60;
  let lastMonth = '';
  const items = ev.slice(0, limit).map((e) => {
    const mo = MONTHS[+e.date.slice(5, 7) - 1] + ' ' + e.date.slice(0, 4);
    const head = mo !== lastMonth ? `<h3 style="margin:16px 0 4px">${mo}</h3>` : ''; lastMonth = mo;
    const p = eventParts(e);
    return `${head}<a class="li" href="#machine-${e.machine.id}" style="align-items:flex-start"><div style="min-width:0">
      <div class="t">${esc(e.machine.name)} <span class="chip pr">${PR_LABEL[e.kind]}</span>${e.phaseCount > 1 ? ` <span class="chip neutral">Phase ${e.phase}</span>` : ''}</div>
      <div class="s" style="color:var(--text);white-space:normal">${p.title}</div>
      <div class="s" style="white-space:normal">New <b style="color:var(--text)">${p.now}</b> · previous ${p.was} · <span class="up">${p.gain}</span></div></div>
      <div class="r s">${fmtDate(e.date)}${e.time ? '<br>' + fmtTime(e.time) : ''}</div></a>`;
  }).join('');
  const ms = machineList().filter((m) => workoutsFor(m.id).length);
  return `<h1>Records &amp; milestones</h1><p class="sub">Every record you’ve set, kept as a permanent timeline. Warm-ups never count, and each control phase is judged on its own.</p>
  <div class="row" style="gap:8px;margin-bottom:12px">
    <select data-input="rmachine" aria-label="Machine" style="width:auto;margin:0;min-width:180px"><option value="">All machines</option>${ms.map((m) => `<option value="${m.id}" ${m.id === mid ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>
    <select data-input="rorder" aria-label="Order" style="width:auto;margin:0"><option value="new" ${order === 'new' ? 'selected' : ''}>Newest first</option><option value="old" ${order === 'old' ? 'selected' : ''}>Oldest first</option></select>
  </div>
  <div class="seg" role="group" aria-label="Record type" style="margin-bottom:14px"><button data-action="rkind" data-v="all" class="${kind === 'all' ? 'on' : ''}">All <span class="muted">${total}</span></button>${EVENT_KINDS.map(([k, l]) => `<button data-action="rkind" data-v="${k}" class="${kind === k ? 'on' : ''}">${l} <span class="muted">${counts[k]}</span></button>`).join('')}</div>
  ${mid ? currentRecordsCard(mid) : ''}
  <div class="card ${mid ? 'section' : ''}"><h2>Timeline</h2>${ev.length ? `<div class="list">${items}</div>${ev.length > limit ? `<button class="btn sm" data-action="rmore" style="margin-top:10px">Show more</button>` : ''}`
    : `<p class="muted">${total ? 'No records of this type yet.' : 'Records appear once you beat a previous workout on a machine.'}</p>`}</div>`;
}

// Current records for one machine vs the record it replaced, the phase start and the best ever.
function currentRecordsCard(mid) {
  const u = U(), cur = statsFor(mid, 'current'), all = statsFor(mid, 'all'), pts = cur.points;
  if (!pts.length) return '';
  const bestN = (m, n) => { let b = null; for (const k in m.repsByWeight) if (m.repsByWeight[k] >= n && (b == null || +k > b)) b = +k; return b; };
  // value now, the best before the workout that set it, and the first workout of the phase
  const track = (fn) => {
    let best = null, at = -1;
    pts.forEach((p, i) => { const v = fn(p.m); if (v != null && (best == null || v > best + 1e-9)) { best = v; at = i; } });
    if (best == null) return null;
    let prev = null; for (let i = 0; i < at; i++) { const v = fn(pts[i].m); if (v != null && (prev == null || v > prev)) prev = v; }
    return { now: best, date: pts[at].date, prev, start: fn(pts[0].m) };
  };
  const rows = [];
  const add = (name, fn, fmtV, detail, ever) => { const t = track(fn); if (t) rows.push({ name, ...t, fmtV, detail: detail ? detail(t) : '', ever }); };
  const W = (v) => `${fmt(v)} ${u}`;
  add('Heaviest weight', (m) => m.topWeight, W, () => `× ${cur.maxWeight.reps}`, W(all.maxWeight.value));
  add('Est. strength', (m) => L.round1(m.best.e1rm), W, () => `${fmt(cur.bestSet.weight)}×${cur.bestSet.reps}`, W(all.bestSet.e1rm));
  add('Workout volume', (m) => m.volume, (v) => `${fmtInt(v)} ${u}`, null, `${fmtInt(all.bestVolume.value)} ${u}`);
  for (const n of L.REP_MILESTONES) add(`${n}-rep max`, (m) => bestN(m, n), W, null, all.nrm[n] ? W(all.nrm[n].weight) : '—');
  return `<div class="card"><h2>Current records · ${esc(S.machines[mid].name)}</h2>
    <p class="muted" style="font-size:13px;margin-top:-6px">Phase ${cur.phaseCount}${cur.phaseCount > 1 ? ` of ${cur.phaseCount}` : ''}, since ${fmtDate(cur.phaseStart)}. “Previous” is the best before this record was set; “Best ever” includes earlier phases.</p>
    <div class="list">${rows.map((r) => {
      const ch = r.start != null ? r.now - r.start : null;
      return `<div class="li" style="align-items:flex-start"><div style="min-width:0"><div class="t">${r.name}</div>
        <div class="s" style="white-space:normal">Previous ${r.prev == null ? '—' : r.fmtV(r.prev)} · Phase start ${r.start == null ? '—' : r.fmtV(r.start)}${ch != null ? ` (<span class="${ch > 0 ? 'up' : ch < 0 ? 'down' : 'muted'}">${signed(ch, '')}</span>)` : ''} · Best ever ${r.ever}</div></div>
        <div class="r"><div class="num" style="font-weight:650">${r.fmtV(r.now)}</div><div class="s">${r.detail ? r.detail + ' · ' : ''}${fmtDate(r.date)}</div></div></div>`;
    }).join('')}</div></div>`;
}

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-action]'); if (!a) return;
  if (a.dataset.action === 'rkind') { S.ui.rf = { ...(S.ui.rf || {}), kind: a.dataset.v }; S.recLimit = 60; saveUi(); render(); }
  if (a.dataset.action === 'rmore') { S.recLimit = (S.recLimit || 60) + 60; render(); }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.input === 'rmachine') { S.ui.rf = { ...(S.ui.rf || {}), machine: t.value }; S.recLimit = 60; saveUi(); render(); }
  if (t.dataset.input === 'rorder') { S.ui.rf = { ...(S.ui.rf || {}), order: t.value }; saveUi(); render(); }
});

// ---------- Nutrition ----------
const SERVING_UNITS = ['g', 'ml', 'oz', 'fl oz', 'cup', 'tbsp', 'tsp', 'piece', 'slice', 'scoop', 'serving'];
const NUTRITION_ROUTE = /^(nutrition|nhistory|ngoals|foods|food-new|food-edit-|meal-new|meal-edit-|add-|entry-)/;
const MACROS = [['cal', 'Calories', 'kcal'], ['p', 'Protein', 'g'], ['c', 'Carbs', 'g'], ['f', 'Fat', 'g']];
const MCOLOR = { p: 'var(--m-p)', c: 'var(--m-c)', f: 'var(--m-f)', cal: 'var(--text-2)' };
const MNAME = { p: 'Protein', c: 'Carbs', f: 'Fat', cal: 'Calories' };
const nf = (x) => (x == null || !isFinite(x) ? '—' : (Math.round(x * 10) / 10).toLocaleString(undefined, { maximumFractionDigits: 1 }));
const kc = (x) => Math.round(x).toLocaleString();
const ndate = () => S.ndate || today();
const goalsList = () => Object.values(S.ngoals).filter((g) => g.from);
const dayEntries = (d) => ((S.days[d] || {}).entries || []);
const mealCats = () => S.prefs.mealCats || DEFAULT_MEALS;
const mealName = (id) => (mealCats().find((m) => m.id === id) || { name: 'Other' }).name;
const qtyText = (q) => { const w = Math.floor(q), fr = q - w, F = { 0.25: '¼', 0.5: '½', 0.75: '¾' }; const k = Object.keys(F).find((x) => Math.abs(fr - x) < 0.001);
  return k ? (w ? w : '') + F[k] : nf(q); };
const servingText = (e) => `${qtyText(e.qty)} × ${nf(e.servingSize)} ${esc(e.servingUnit)}${e.qty !== 1 ? ` <span class="muted">(${nf(e.qty * e.servingSize)} ${esc(e.servingUnit)})</span>` : ''}`;
const macroLine = (t) => `P ${nf(t.p)} · C ${nf(t.c)} · F ${nf(t.f)}`;
const dayLabel = (d) => (d === today() ? 'Today' : d === NL.addDays(today(), -1) ? 'Yesterday' : fmtDate(d, true));

async function saveDay(date, entries) {
  if (!entries.length) return Store.del('day_' + date);
  return Store.put('day_' + date, { kind: 'day', date, entries });
}

function viewNutritionRoute(r) {
  if (r === 'nutrition') return viewNutrition();
  if (r === 'nhistory') return viewNHistory();
  if (r === 'ngoals') return viewGoals();
  if (r === 'foods') return viewFoods();
  if (r === 'food-new') return viewFoodEdit(null);
  if (r.startsWith('food-edit-')) return viewFoodEdit(r.slice(10));
  if (r === 'meal-new') return viewMealEdit(null);
  if (r.startsWith('meal-edit-')) return viewMealEdit(r.slice(10));
  if (r.startsWith('add-')) return viewAdd(r.slice(4));
  if (r.startsWith('entry-')) return viewEntry(r.slice(6, 16), r.slice(17));
  return viewNutrition();
}
const nTabs = (on) => `<div class="seg" role="tablist" style="margin-bottom:14px">${[['nutrition', 'Diary'], ['nhistory', 'History'], ['foods', 'Foods & meals'], ['ngoals', 'Goals']].map(([h, l]) =>
  `<a href="#${h}" role="tab" class="segl ${on === h ? 'on' : ''}">${l}</a>`).join('')}</div>`;

// ---- Pie chart (share of macro calories) ----
function pieSvg(split, size = 170) {
  const r = size / 2, ir = r * 0.58, cx = r, cy = r;
  if (!split) return `<svg width="${size}" height="${size}" aria-hidden="true"><circle cx="${cx}" cy="${cy}" r="${(r + ir) / 2}" fill="none" stroke="var(--surface-2)" stroke-width="${r - ir}"/></svg>`;
  const parts = split.parts.filter((p) => p.kcal > 0);
  if (parts.length === 1) return `<svg width="${size}" height="${size}" role="img" aria-label="${MNAME[parts[0].key]} 100%"><circle cx="${cx}" cy="${cy}" r="${(r + ir) / 2}" fill="none" stroke="${MCOLOR[parts[0].key]}" stroke-width="${r - ir}"><title>${MNAME[parts[0].key]} 100%</title></circle></svg>`;
  let a0 = -Math.PI / 2, paths = '';
  const pt = (a, rad) => `${(cx + rad * Math.cos(a)).toFixed(2)},${(cy + rad * Math.sin(a)).toFixed(2)}`;
  for (const p of parts) {
    const a1 = a0 + (p.pct / 100) * Math.PI * 2, big = a1 - a0 > Math.PI ? 1 : 0;
    paths += `<path d="M${pt(a0, r)} A${r},${r} 0 ${big} 1 ${pt(a1, r)} L${pt(a1, ir)} A${ir},${ir} 0 ${big} 0 ${pt(a0, ir)} Z" fill="${MCOLOR[p.key]}" stroke="var(--surface)" stroke-width="2"><title>${MNAME[p.key]}: ${p.pct.toFixed(1)}% · ${nf(p.grams)} g · ${kc(p.kcal)} kcal</title></path>`;
    a0 = a1;
  }
  return `<svg width="${size}" height="${size}" role="img" aria-label="Macronutrient split">${paths}<text x="${cx}" y="${cy - 2}" text-anchor="middle" style="font-size:18px;font-weight:650;fill:var(--text)">${kc(split.total)}</text><text x="${cx}" y="${cy + 15}" text-anchor="middle" style="font-size:11px;fill:var(--muted)">macro kcal</text></svg>`;
}
function pieCard(goal, totals) {
  const mode = S.ui.pieMode || S.prefs.pieMode || 'actual';
  const src = mode === 'target' ? goal : totals, split = src ? NL.macroSplit(src) : null;
  let empty = '';
  if (!split) empty = mode === 'target' ? (goal ? 'Your macro targets are all 0 g.' : 'Set protein, carb and fat goals to see your target split.') : 'Nothing logged yet for this day.';
  let note = '';
  if (mode === 'target' && split && goal.cal > 0 && Math.abs(split.total - goal.cal) > 25)
    note = `Your macro targets add up to ${kc(split.total)} kcal; your calorie target is ${kc(goal.cal)} kcal.`;
  if (mode === 'actual' && split && Math.abs(split.total - totals.cal) > Math.max(25, totals.cal * 0.08))
    note = `Logged calories (${kc(totals.cal)}) differ from calories from macros (${kc(split.total)}), e.g. from fiber, alcohol or label rounding.`;
  return `<div class="card"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">Macro split</h2><span class="spacer"></span>
    <div class="seg" role="group" aria-label="Pie mode">${[['actual', 'Actual'], ['target', 'Target']].map(([k, l]) => `<button data-action="npie" data-v="${k}" class="${mode === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    <div class="row" style="gap:18px;align-items:center;justify-content:center" id="pie">${pieSvg(split)}
    <div style="flex:1 1 230px;min-width:0">${split ? split.parts.map((p) => `<div class="row" style="gap:8px;flex-wrap:nowrap;padding:5px 0;border-top:1px solid var(--border)"><span class="dot" style="background:${MCOLOR[p.key]}"></span>
      <span style="flex:1">${MNAME[p.key]}</span><b class="num">${p.pct.toFixed(0)}%</b><span class="muted num" style="text-align:right;white-space:nowrap">${nf(p.grams)} g · ${kc(p.kcal)} kcal</span></div>`).join('') +
      `<div class="muted xs" style="margin-top:4px">${mode === 'target' ? 'Planned split from your gram targets' : 'From food logged this day'} · % of ${kc(split.total)} macro kcal (4/4/9 kcal per g)</div>`
      : `<p class="muted" style="margin:0">${empty}</p>`}</div></div>${note ? `<div class="hint" style="margin:10px 0 0">${note}</div>` : ''}</div>`;
}

// ---- Diary (dashboard) ----
function viewNutrition() {
  const d = ndate(), entries = dayEntries(d), totals = NL.sumTotals(entries), goal = NL.goalFor(goalsList(), d), isToday = d === today();
  const cats = mealCats(), known = new Set(cats.map((c) => c.id));
  const groups = cats.map((c) => ({ ...c, items: entries.filter((e) => e.meal === c.id) }));
  const orphans = entries.filter((e) => !known.has(e.meal));
  if (orphans.length) groups.push({ id: '_other', name: 'Other (removed category)', items: orphans, orphan: true });
  const prog = MACROS.map(([k, label, unit]) => {
    const p = goal ? NL.progress(totals[k], goal[k]) : null;
    const show = (x) => (k === 'cal' ? kc(x) : nf(x));
    return `<div class="card tile"><div class="k"><span class="dot" style="background:${MCOLOR[k]}"></span> ${label}</div>
      <div class="v">${show(totals[k])}<small> ${p && p.target ? `/ ${show(p.target)} ${unit}` : unit}</small></div>
      ${p && p.target ? `<div class="bar" role="progressbar" aria-valuenow="${Math.round(p.pct)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${Math.min(100, p.pct)}%;background:${p.over ? 'var(--bad)' : MCOLOR[k]}"></span></div>
        <div class="d">${p.over ? `<b class="down">${show(-p.remaining)} ${unit} over</b>` : `<b>${show(p.remaining)} ${unit}</b> left`} · ${Math.round(p.pct)}%</div>`
        : `<div class="d muted">${goal ? 'No target set' : 'No goal for this day'}</div>`}</div>`;
  }).join('');
  return `<div class="row" style="margin-bottom:6px"><h1>Nutrition</h1></div>${nTabs('nutrition')}
  <div class="row datenav" style="margin-bottom:14px"><button class="btn sm" data-action="nday" data-v="-1" aria-label="Previous day">‹</button>
    <label style="font-weight:650;position:relative">${dayLabel(d)}${d !== today() ? '' : ` <span class="muted" style="font-weight:400">${fmtDate(d)}</span>`}
      <input type="date" data-input="ndate" value="${d}" max="${today()}" aria-label="Pick a date" style="position:absolute;inset:0;opacity:0;margin:0;cursor:pointer"></label>
    <button class="btn sm" data-action="nday" data-v="1" aria-label="Next day" ${isToday ? 'disabled' : ''}>›</button>${isToday ? '' : '<button class="btn sm ghost" data-action="ntoday">Today</button>'}</div>
  ${!goalsList().length ? `<div class="card" style="margin-bottom:14px;border-color:var(--accent)"><h2>Set your daily goals</h2><p class="muted" style="margin-top:-6px">Choose your own calorie, protein, carb and fat targets. Nothing is pre-set.</p><a class="btn primary" href="#ngoals">Set goals</a></div>` : ''}
  <div class="grid g4">${prog}</div>
  <div class="section">${pieCard(goal, totals)}</div>
  ${groups.map((g) => {
    const t = NL.sumTotals(g.items);
    return `<div class="card section"><div class="row" style="margin-bottom:4px"><h2 style="margin:0">${esc(g.name)}</h2><span class="spacer"></span>
      <span class="num" style="font-weight:650">${kc(t.cal)} kcal</span></div>
      ${g.items.length ? `<div class="muted xs" style="margin-bottom:4px">${macroLine(t)}</div><div class="list">${g.items.map((e) => { const x = NL.entryTotals(e);

// ---- Add food to a meal ----
function recentFoods() {
  const seen = new Map(), saved = new Set(Object.values(S.foods).map((f) => f.name.toLowerCase()));
  for (const d of Object.keys(S.days).sort().reverse()) for (const e of dayEntries(d)) {
    const k = e.name.toLowerCase();
    if (!seen.has(k) && !saved.has(k)) seen.set(k, { ...e, lastDate: d });
    if (seen.size >= 40) break;
  }
  return [...seen.values()];
}
function searchResults(q) {
  q = q.trim().toLowerCase();
  const m = (x) => !q || (x.name + ' ' + (x.brand || '')).toLowerCase().includes(q);
  const foods = Object.values(S.foods).filter(m).sort((a, b) => a.name.localeCompare(b.name));
  const meals = Object.values(S.meals).filter(m).sort((a, b) => a.name.localeCompare(b.name));
  const recent = recentFoods().filter(m);
  const per = (f) => `${kc(f.cal)} kcal · ${macroLine(f)} per ${nf(f.servingSize)} ${esc(f.servingUnit)}`;
  const item = (src, id, title, sub) => `<button type="button" class="li pick" data-action="npick" data-src="${src}" data-id="${esc(id)}"><div style="min-width:0;text-align:left"><div class="t">${title}</div><div class="s">${sub}</div></div><div class="r" style="font-size:20px;color:var(--accent)">+</div></button>`;
  let html = '';
  if (meals.length) html += `<h3>Saved meals</h3><div class="list">${meals.map((x) => { const t = NL.sumTotals(x.items); return item('meal', x.id, esc(x.name), `${x.items.length} item${x.items.length === 1 ? '' : 's'} · ${kc(t.cal)} kcal · ${macroLine(t)}`); }).join('')}</div>`;
  if (foods.length) html += `<h3 style="margin-top:14px">My foods</h3><div class="list">${foods.slice(0, 50).map((x) => item('food', x.id, esc(x.name) + (x.brand ? ` <span class="muted">· ${esc(x.brand)}</span>` : ''), per(x))).join('')}</div>`;
  if (recent.length) html += `<h3 style="margin-top:14px">Recently logged</h3><div class="list">${recent.slice(0, 20).map((x) => item('recent', x.name, esc(x.name), per(x))).join('')}</div>`;
  if (!html) html = `<p class="muted">${q ? `No saved foods match “${esc(q)}”.` : 'You have no saved foods yet.'}</p>`;
  const look = q.length >= 2 && S.sampleOk !== false && typeof OFFLINE_APP === 'undefined' ? `<button type="button" class="btn" data-action="nlookup" style="margin-top:12px">Look up “${esc(q)}” with Claude</button>
    <p class="muted xs" style="margin:4px 0 0">Claude estimates typical values (USDA-style). You can check and edit them before adding. Uses your Claude usage.</p>` : '';
  return html + look;
}

// ---- History & analytics ----
function viewNHistory() {
  const range = S.ui.nrange || '30d', metric = S.ui.nmetric || S.prefs.nMetric || 'cal', per = S.ui.nper || 'week';
  const days = { '7d': 7, '30d': 30, '90d': 90, '1y': 365 }[range];
  const to = today(), from = NL.addDays(to, -(days - 1));
  const diary = {}; for (const k in S.days) diary[k] = dayEntries(k);
  const ser = NL.dailySeries(diary, goalsList(), from, to), logged = ser.filter((r) => r.logged);
  const ach = NL.achievement(ser), avgs = NL.averages(ser, per), wd = NL.byWeekday(ser, metric);
  const unit = metric === 'cal' ? 'kcal' : 'g', show = (x) => (metric === 'cal' ? kc(x) : nf(x));
  afterRender.push(() => drawChart('nchart', logged.map((r) => ({ t: r.date, y: r.totals[metric], xl: fmtDate(r.date), goal: r.goal ? r.goal[metric] : null,

  <div class="grid g2 section">

        <td class="n">${g.pct[metric] == null ? '—' : `<span class="${g.pct[metric] < NL.HIT_LOW ? 'down' : g.pct[metric] > NL.HIT_HIGH ? 'warmtxt' : 'up'}">${Math.round(g.pct[metric])}%</span>`}</td></tr>`).join('')}</tbody></table></div>

// ---- Claude look-up ----
async function lookupFood(q) {
  const box = $('#lookupmsg');
  let sample = null;
  try { if (window.claude && claude.use) sample = await claude.use('sample'); } catch (e) {}
  if (!sample) { S.sampleOk = false; box.innerHTML = '<div class="hint">Look-up isn’t available here. Enter the nutrition manually instead.</div>'; return; }
  const btn = $('[data-action="nlookup"]'); if (btn) { btn.disabled = true; btn.textContent = 'Looking up…'; }
  const prompt = `You are a nutrition reference. Give nutrition facts for this food: "${q.slice(0, 120)}".
Use values as listed in USDA FoodData Central for generic foods, or the typical package label for branded foods.
Choose one common serving: prefer 100 g for generic foods, or the labeled serving for packaged or branded items.
Reply with ONLY a JSON object exactly like {"name":"Chicken breast, roasted, skinless","servingSize":100,"servingUnit":"g","cal":165,"p":31,"c":0,"f":3.6,"basis":"USDA FDC, roasted"}.
servingUnit must be one of: ${SERVING_UNITS.join(', ')}. Use plain numbers, no ranges. If this is not a food, reply {"error":"not a food"}.`;
  try {
    const r = await sample.json(prompt, { modelTier: 'quick' });
    if (!r || r.error) throw { code: 'notfood' };
    const v = NL.validateFood({ ...r, servingUnit: SERVING_UNITS.includes(r.servingUnit) ? r.servingUnit : 'serving' });
    if (!v.ok) throw { code: 'bad' };
    const meal = route().slice(4);
    S.draft = { mode: 'food', ...v.value, source: 'estimate', basis: String(r.basis || '').slice(0, 80), qty: '1', amount: String(v.value.servingSize), meal, save: true };
    render();
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = `Look up “${q}” with Claude`; }
    const msg = e && e.code === 'not_granted' || e && e.code === 'sampling_disabled' ? 'Look-up wasn’t allowed, so it’s turned off for now.' : e && e.code === 'notfood' ? 'That doesn’t look like a food. Try a more specific name.'
      : e && e.code === 'rate_limited' ? 'Too many look-ups right now. Try again in a bit.' : 'Couldn’t get an estimate. Try again, or enter it manually.';
    if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled')) S.sampleOk = false;
    box.innerHTML = `<div class="hint">${msg}</div>`;
  }
}

document.addEventListener('submit', async (e) => {
  const form = e.target.closest('form[data-form]'); if (!form) return;
  const kind = form.dataset.form, d = S.draft;
  if (!['portion', 'food', 'entry', 'meal', 'goals'].includes(kind)) return;
  e.preventDefault();
  const btn = form.querySelector('[type=submit]');
  const busy = async (fn) => { btn.disabled = true; try { await fn(); } catch (err) { btn.disabled = false; showFErr(errMsg(err)); throw err; } };
  const qtyOk = () => { const q = NL.parseQty(d.qty); if (!isFinite(q) || q <= 0 || q > 100) { showFErr('Enter how much you had, e.g. 1, 1.5 or 1/2 servings.'); return null; } return q; };
  try {
    if (kind === 'portion' && d.mode === 'mealadd') {
      const q = qtyOk(); if (q == null) return;
      const m = S.meals[d.mealRef], date = ndate();
      const add = m.items.map((i) => ({ id: uid(), meal: d.meal, name: i.name, brand: i.brand || '', servingSize: i.servingSize, servingUnit: i.servingUnit, cal: i.cal, p: i.p, c: i.c, f: i.f, qty: +(i.qty * q).toFixed(3), foodId: i.foodId || null, mealRef: m.id, at: Date.now() }));
      await busy(() => saveDay(date, [...dayEntries(date), ...add]));
      toast(`Added ${m.name}`); S.draft = null; S.fq = ''; return go('nutrition');
    }
    if (kind === 'portion' || kind === 'food' || kind === 'entry') {
      if (kind === 'food' && d.mode === 'library') {
        const v = NL.validateFood(d); if (!v.ok) return showFErr(v.error);
        const id = d.id || uid();
        await busy(() => Store.put('food_' + id, { kind: 'food', ...v.value, source: d.id ? (S.foods[id].source === 'estimate' && sameNutrition(S.foods[id], v.value) ? 'estimate' : 'custom') : 'custom', createdAt: S.foods[id]?.createdAt || Date.now() }));
        toast(d.id ? 'Food saved' : 'Food added'); S.draft = null; return go('foods');
      }
      const v = NL.validateFood(d); if (!v.ok) return showFErr(v.error);
      const q = qtyOk(); if (q == null) return;
      const date = kind === 'entry' ? d.date : ndate();
      let foodId = d.foodId || null;
      if (kind === 'food' && d.save) {
        foodId = uid();
        await busy(() => Store.put('food_' + foodId, { kind: 'food', ...v.value, source: d.source === 'estimate' ? 'estimate' : 'custom', createdAt: Date.now() }));

      const entry = { id: d.id && kind === 'entry' ? d.id : uid(), meal: d.meal, ...v.value, qty: q, foodId, source: d.source === 'estimate' && (kind !== 'entry' || sameNutrition(d, v.value)) ? 'estimate' : (d.source === 'estimate' ? 'edited' : ''), at: d.at || Date.now() };
      const list = dayEntries(date);
      const next = kind === 'entry' ? list.map((x) => (x.id === entry.id ? entry : x)) : [...list, entry];
      await busy(() => saveDay(date, next));
      toast(kind === 'entry' ? 'Entry saved' : `Added to ${mealName(d.meal)}`); S.draft = null; S.fq = ''; return go('nutrition');
    }
    if (kind === 'meal') {
      const name = String(d.name || '').trim(); if (!name) return showFErr('Give the meal a name.');
      if (!d.items.length) return showFErr('Add at least one food.');
      const items = [];
      for (const i of d.items) { const q = NL.parseQty(i.qty); if (!isFinite(q) || q <= 0 || q > 100) return showFErr(`Check the servings for ${i.name}.`); items.push({ ...i, qty: q }); }
      const id = d.id || uid();
      await busy(() => Store.put('meal_' + id, { kind: 'meal', name: name.slice(0, 60), items, createdAt: S.meals[id]?.createdAt || Date.now() }));
      toast(d.id ? 'Meal saved' : 'Meal created'); S.draft = null; return go('foods');
    }
    if (kind === 'goals') {
      const g = {};
      for (const [k, l] of MACROS) { const v = Number(d[k]); if (d[k] === '' || !isFinite(v) || v < 0 || v > 20000) return showFErr(`${l} goal must be a number of 0 or more.`); g[k] = NL.r1(v); }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d.from || '')) return showFErr('Pick the date these goals start.');
      await busy(() => Store.put('ngoal_' + d.from, { kind: 'ngoal', from: d.from, ...g, savedAt: Date.now() }));
      toast('Goals saved'); S.draft = null; return go('nutrition');
    }
  } catch (err) { /* shown by busy() */ }
});
